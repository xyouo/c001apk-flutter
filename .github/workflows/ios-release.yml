name: iOS Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-release.yml'
      - 'assets/**'
      - 'ios/**'
      - 'lib/**'
      - 'scripts/package_ipa.sh'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ios-release.yml'
      - 'assets/**'
      - 'ios/**'
      - 'lib/**'
      - 'scripts/package_ipa.sh'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        # Keep legacy deprecation/lint findings visible while failing on errors.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Prepare iOS build
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: bash scripts/package_ipa.sh

      - name: Upload IPA artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ipa
          path: build/ios/ipa/c001apk-flutter.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        # softprops/action-gh-release v2.2.1
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb2475698d6f732fcb5e2c4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: ci-${{ github.sha }}
          name: "iOS build ${{ github.sha }}"
          files: build/ios/ipa/c001apk-flutter.ipa
          generate_release_notes: true