name: iOS Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-release.yml'
      - 'assets/**'
      - 'ios/**'
      - 'lib/**'
      - 'scripts/package_ipa.sh'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ios-release.yml'
      - 'assets/**'
      - 'ios/**'
      - 'lib/**'
      - 'scripts/package_ipa.sh'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        # Keep legacy deprecation/lint findings visible while failing on errors.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Prepare iOS build
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: bash scripts/package_ipa.sh

      - name: Compute next release version
        id: release-version
        run: |
          set -eo pipefail
          base=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$base" ]; then base="1.0.0"; fi
          try=$base
          while git rev-parse -q --verify "refs/tags/v${try}" >/dev/null 2>&1; do
            major=${try%%.*}; rest=${try#*.}; minor=${rest%%.*}; patch=${rest##*.}
            patch=$((patch+1))
            try="${major}.${minor}.${patch}"
          done
          echo "base=${base}"
          echo "version=${try}"
          echo "version=${try}" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-ipa
          path: build/ios/ipa/c001apk-flutter.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        # softprops/action-gh-release v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: v${{ steps.release-version.outputs.version }}
          name: "${{ steps.release-version.outputs.version }}"
          files: build/ios/ipa/c001apk-flutter.ipa
          generate_release_notes: true